<!-- Ancienne adresse des actualites. Les vraies pages sont news-xx.html, media-xx.html, partners-xx.html
     (fabriquees par ort_news_pages.py). Cette page renvoie vers la bonne, d'apres ?lang= et ?tab=. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>OneRoadTrip</title>
<script>
(function(){
  var LANGS = ['fr','en','es','it','pt','de','nl'];
  var RUB = { news:'news', press:'media', media:'media', partners:'partners' };
  var q = new URLSearchParams(location.search);
  var lang = (q.get('lang') || '').slice(0,2).toLowerCase();
  if (LANGS.indexOf(lang) === -1){
    try { lang = (localStorage.getItem('lang') || '').slice(0,2).toLowerCase(); } catch(e){ lang = ''; }
  }
  if (LANGS.indexOf(lang) === -1){
    var nav = navigator.languages || [navigator.language || ''];
    lang = 'en';
    for (var i = 0; i < nav.length; i++){
      var n = String(nav[i] || '').slice(0,2).toLowerCase();
      if (LANGS.indexOf(n) !== -1){ lang = n; break; }
    }
  }
  var tab = (q.get('tab') || (location.hash || '').replace('#','') || 'news').toLowerCase();
  location.replace('/' + (RUB[tab] || 'news') + '-' + lang + '.html');
})();
</script>

      var url="https://firestore.googleapis.com/v1/projects/oneroadtrip-prod/databases/(default)/documents/template_events";
