<style>
:root{--bg:#f5efe4;--ink:#3a2f22;--ink-soft:#4a4030;--muted:#8a7d68;--accent:#c1502e;--heroBase:#efe7d8;--card-bg:#fffdf9;--card-border:#e2d8c4;--max:1100px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
.header{display:flex;justify-content:space-between;align-items:center;max-width:var(--max);margin:0 auto;padding:14px 20px}
.header .logo{font-size:1.35rem;font-weight:700;color:var(--ink);font-family:"Instrument Serif",Georgia,serif}
.header .logo span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:10px}
.langpick{background:#fffdf9;border:1px solid var(--card-border);color:var(--ink);padding:6px 10px;border-radius:6px;font-size:.8rem;font-family:inherit;cursor:pointer}
.auth{position:relative}
.auth .btn{background:transparent;border:1px solid var(--card-border);color:var(--ink-soft);padding:6px 12px;border-radius:6px;font-size:.8rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.auth .btn:hover{background:#fffdf9;border-color:var(--accent);color:var(--ink)}
.auth-pop{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fffdf9;border:1px solid var(--card-border);border-radius:8px;padding:8px;flex-direction:column;gap:6px;min-width:180px;box-shadow:0 8px 24px rgba(58,47,34,.12);z-index:20}
.auth-pop.open{display:flex}
.auth-pop .btn{width:100%;text-align:left}
.auth-pop .btn.out{color:var(--accent)}
.lang-select button{background:transparent;border:1px solid var(--card-border);color:var(--muted);padding:5px 10px;border-radius:4px;font-size:.75rem;font-weight:600;font-family:inherit;cursor:pointer;text-transform:uppercase;transition:all .2s}
.lang-select button:hover{background:#fffdf9;color:var(--ink)}
.lang-select button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.blog-hero{text-align:center;padding:clamp(2rem,6vh,4rem) 20px clamp(1.5rem,4vh,3rem);background:linear-gradient(135deg,var(--heroBase),var(--bg));border-bottom:1px solid var(--card-border)}
.blog-hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:400;color:var(--ink);margin-bottom:.5rem;font-family:"Instrument Serif",Georgia,serif;line-height:1.1}
.blog-hero p{font-size:clamp(.95rem,2vw,1.1rem);color:var(--ink-soft);max-width:600px;margin:0 auto;line-height:1.6}
.filters{max-width:var(--max);margin:0 auto;padding:1.5rem 20px 0}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;background:#fffdf9;border:1px solid var(--card-border);color:var(--ink);padding:12px 16px;border-radius:8px;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{border-color:var(--accent)}
.filter-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filter-tag{background:transparent;border:1px solid var(--card-border);color:var(--ink-soft);padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.filter-tag:hover{background:#fffdf9;border-color:var(--accent);color:var(--ink)}
.filter-tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.articles{max-width:var(--max);margin:0 auto;padding:2rem 20px 3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.article-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer;display:block;color:inherit}
.article-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(58,47,34,.12)}
.article-card img{width:100%;height:200px;object-fit:cover;display:block}
.card-body{padding:1.25rem}
.card-tags{display:flex;gap:6px;margin-bottom:.6rem;flex-wrap:wrap}
.card-tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:3px;background:rgba(193,80,46,.1);color:var(--accent)}
.card-tag.country{background:rgba(58,47,34,.08);color:var(--ink-soft)}
.article-card h2{font-size:1.3rem;font-weight:400;color:var(--ink);margin-bottom:.4rem;line-height:1.25;font-family:"Instrument Serif",Georgia,serif}
.card-excerpt{font-size:.88rem;color:var(--ink-soft);line-height:1.55;margin-bottom:.75rem}
.card-meta{font-size:.75rem;color:var(--muted)}
.no-results{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:1.1rem;grid-column:1/-1}
.back-home{text-align:center;padding:1rem 20px 2rem}
.back-home a{color:var(--accent);font-size:.9rem;font-weight:600}
@media(max-width:768px){
.articles{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.article-card img{height:170px}
}
@media(max-width:480px){
.articles{grid-template-columns:1fr;gap:14px}
.article-card img{height:180px}
.search-row{flex-direction:column}
.header{padding:10px 14px}
.blog-hero{padding:1.5rem 14px 1.2rem}
.blog-hero h1{font-size:1.4rem}
.filters{padding:1rem 14px 0}
.articles{padding:1.2rem 14px 2rem}
.card-body{padding:1rem}
}
</style>
