// ================= Firebase + Auth State =================
(function(){
  function loadScript(src){ 
    return new Promise((ok,ko)=>{
      if(document.querySelector(`script[src="${src}"]`)) return ok();
      const s=document.createElement('script');
      s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('load '+src));

    });

  async function ensureFirebase(){
    if(window.firebase?.apps?.length) return window.firebase;
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');

// ================= Persistance des voyages (par utilisateur) =================

// === Photos des lieux (photos_lieux.json) pour carrousel ===
let PHOTOS_LIEUX = null;
async function loadPhotosLieuxOnce(){
  if (PHOTOS_LIEUX) return PHOTOS_LIEUX;
  try{
    const r = await fetch('/data/photos-json/photos_lieux.json');
    PHOTOS_LIEUX = r.ok ? (await r.json()) : {};
  }catch(_){ PHOTOS_LIEUX = {}; }
  return PHOTOS_LIEUX;
}
function getPhotosForPlace(pid){
  if (!PHOTOS_LIEUX) return [];
  const entry = PHOTOS_LIEUX[pid];
  if (!entry) return [];
  const raw = Array.isArray(entry.photos) ? entry.photos : [];
  // Accepte les 2 formats : string (ancien) ou objet {url,caption,keyword} (nouveau R2)
  const out = [];
  for (let i = 0; i < raw.length; i++){
    const p = raw[i];
    if (typeof p === 'string') out.push(p);
    else if (p && p.url) out.push(p.url);
  }
  return out;
}

// Collecter jusqu'à 4 photos du voyage (depuis tous les steps)
function getTripPhotos(rt, maxPhotos = 4){
  const photos = [];
  if (!rt.steps || !Array.isArray(rt.steps)) return photos;
  
  for (const step of rt.steps) {
    if (photos.length >= maxPhotos) break;
    const pid = step.place_id || step.pid;
    if (!pid) continue;
    
    const stepPhotos = getPhotosForPlace(pid);
    for (const photo of stepPhotos) {
      if (photos.length >= maxPhotos) break;
      photos.push(photo);
    }
  }
  
  return photos;
}

// -- helpers Leaflet (init tardive) --
function onLeafletReady(cb){
  if (window.L) return cb();
  const i = setInterval(()=>{ if(window.L){ clearInterval(i); cb(); } }, 50);
}
function initLeafletMap(div, rt){
  try{
    const m = window.L.map(div,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false});
    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
    if (rt.coordsPath && rt.coordsPath.length>=2) {
      const line = window.L.polyline(rt.coordsPath,{weight:3}).addTo(m);
      m.fitBounds(line.getBounds(),{padding:[8,8]});
      L.marker(rt.coordsPath[0]).addTo(m);
      L.marker(rt.coordsPath[rt.coordsPath.length-1]).addTo(m);
    } else if (rt.coords) {
      L.marker(rt.coords).addTo(m); m.setView(rt.coords,6);
    }
  }catch(_){}
}

    const c = document.createElement('div'); c.className='card';

// Renvoie vers le constructeur de carte, qui rechargera les etapes de ce voyage
function openBuilder(rt){
  const lang = localStorage.getItem('lang') || localStorage.getItem('ORT_LANG') || 'fr';
  location.href = `carte_builder.html?tripId=${encodeURIComponent(rt.id)}&lang=${lang}`;
}

function openRT(rt){
    const lang = localStorage.getItem('lang') || 'fr';
    const url = `roadtrip_detail.html?tripId=${encodeURIComponent(rt.id)}&lang=${lang}`;
    location.href = url;
  }

  // Construit l'URL de la page statique si le voyage provient d'un itinéraire pré-fabriqué
  function buildStaticUrl(rt) {
    const lang = localStorage.getItem('lang') || 'fr';
    // Le voyage doit avoir un _originalItinId (posé par l'éditeur statique) ou un sourceUrl pointant vers une page statique
    var itinId = rt._originalItinId || '';
    var sourceUrl = rt.sourceUrl || '';

    // Si on a un sourceUrl qui pointe vers une page statique ORT, utiliser le chemin uniquement
    if (sourceUrl && /\/(itineraires|itineraries|rutas|roteiros|itinerari|masar)\//.test(sourceUrl)) {
      try { return new URL(sourceUrl, location.origin).pathname; } catch(e) { return sourceUrl.replace(/^https?:\/\/[^\/]+/, ''); }
    }

    // Sinon, si on a un itinId, construire l'URL
    // Mais ignorer les itinIds "custom" ou temporaires (générés par RT Detail, pas du catalogue)
    if (itinId && !/custom|^temp|^\d{10,}/.test(itinId)) {
      // Slugifier comme generate-v2.js : "84::vaucluse" → "84-vaucluse", "KH::phnom-penh" → "kh-phnom-penh"
      var slug = itinId.toLowerCase().replace(/::/g, '-').replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      var LSLUG = {fr:'itineraires', en:'itineraries', es:'rutas', pt:'roteiros', it:'itinerari', ar:'masar', nl:'routes', de:'routen'};
      var langSlug = LSLUG[lang] || 'itineraries';
      return '/' + langSlug + '/' + slug + '.html';
    }

    // Pas d'itinéraire catalogue → page coquille custom.html
    // Le voyage sera chargé depuis Firestore via tripId dans l'URL
    if (rt.steps && rt.steps.length > 0) {
      var LSLUG2 = {fr:'itineraires', en:'itineraries', es:'rutas', pt:'roteiros', it:'itinerari', ar:'masar', nl:'routes', de:'routen'};
      var langSlug2 = LSLUG2[lang] || 'itineraries';
      return '/' + langSlug2 + '/custom.html';
    }

    return null; // vraiment rien à afficher
  }

  // Générer une image Canvas pour partage viral
  async function generateViralImage(rt) {
    return new Promise((resolve) => {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      // Format Instagram/Facebook optimal
      canvas.width = 1080;
      canvas.height = 1350;
      
      // Fond blanc
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Photos sélectionnées (4 max)
      const photos = rt.selectedPhotos && rt.selectedPhotos.length > 0 
        ? rt.selectedPhotos 
        : getTripPhotos(rt, 4);
      
      const photoHeight = 600;
      let loadedCount = 0;
      const totalPhotos = Math.min(photos.length, 4);
      
      if (totalPhotos === 0) {
        // Pas de photos, dessiner juste le texte
        drawTextContent();
        resolve(canvas.toDataURL('image/png'));
        return;
      }
      
      // Charger et dessiner les photos en mosaïque 2x2
      photos.slice(0, 4).forEach((photoUrl, i) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const x = (i % 2) * 540;
          const y = Math.floor(i / 2) * 300;
          ctx.drawImage(img, x, y, 540, 300);
          
          loadedCount++;
          if (loadedCount === totalPhotos) {
            drawTextContent();
            resolve(canvas.toDataURL('image/png'));
          }
        };
        img.onerror = () => {
          loadedCount++;
          if (loadedCount === totalPhotos) {
            drawTextContent();
            resolve(canvas.toDataURL('image/png'));
          }
        };
        img.src = photoUrl;
      });
      
      function drawTextContent() {
        // Overlay semi-transparent sur les photos pour le titre
        ctx.fillStyle = 'rgba(17, 63, 122, 0.85)';
        ctx.fillRect(0, photoHeight - 100, 1080, 100);
        
        // Titre du voyage
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 42px system-ui, sans-serif';
        ctx.textAlign = 'center';
        const title = rt.title || 'Mon Roadtrip';
        ctx.fillText(title.substring(0, 40), 540, photoHeight - 45);
        
        // Section infos (fond blanc)
        let y = photoHeight + 40;
        
        // Dates du voyage
        if (rt.steps && rt.steps.length > 0 && rt.steps[0].date) {
          const firstDate = rt.steps[0].date;
          const lastStep = rt.steps[rt.steps.length - 1];
          const lastDate = lastStep.date;
          
          ctx.fillStyle = '#113f7a';
          ctx.font = 'bold 32px system-ui';
          ctx.textAlign = 'left';
          ctx.fillText('📅 ' + formatDateRange(firstDate, lastDate), 60, y);
          y += 60;
        }
        
        // Stats
        ctx.fillStyle = '#113f7a';
        ctx.font = '28px system-ui';
        const nights = rt.nights || rt.nb_nights || 0;
        const kms = rt.kms || 0;
        ctx.fillText(`🌙 ${nights} nuits · 🚗 ${kms} km`, 60, y);
        y += 80;
        
        // Étapes
        ctx.font = 'bold 26px system-ui';
        ctx.fillText('📍 Nos étapes :', 60, y);
        y += 50;
        
        ctx.font = '24px system-ui';
        if (rt.steps && rt.steps.length > 0) {
          rt.steps.slice(0, 8).forEach((step, i) => {
            const stepName = step.name || step.place_id?.split('::')[1] || `Étape ${i+1}`;
            ctx.fillText(`   → ${stepName}`, 60, y);
            y += 40;
          });
        }
        
        // Footer avec logo et CTA
        y = 1280;
        ctx.fillStyle = '#113f7a';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('Créez votre roadtrip sur OneRoadTrip.com', 540, y);
      }
      
      function formatDateRange(start, end) {
        if (!start) return '';
        const startDate = new Date(start);
        const endDate = end ? new Date(end) : startDate;
        
        const options = { day: '2-digit', month: 'short' };
        const startStr = startDate.toLocaleDateString(ortDateLocale(), options);
        const endStr = endDate.toLocaleDateString(ortDateLocale(), options);
        
        if (startStr === endStr) return startStr;
        return `Du ${startStr} au ${endStr}`;
      }
      
      // Timeout de sécurité si les images ne chargent pas
      setTimeout(() => {
        if (loadedCount < totalPhotos) {
          drawTextContent();
          resolve(canvas.toDataURL('image/png'));
        }
      }, 5000);
    });
  }
  
  // Découpe un texte en lignes selon la largeur max
  function wrapText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let currentLine = '';
    
    words.forEach(word => {
      const testLine = currentLine + (currentLine ? ' ' : '') + word;
      const metrics = ctx.measureText(testLine);
      
      if (metrics.width > maxWidth && currentLine) {
        lines.push(currentLine);
        currentLine = word;
      } else {
        currentLine = testLine;
      }
    });
    
    if (currentLine) {
      lines.push(currentLine);
    }
    
    // Limite à 3 lignes max pour l'intro
    return lines.slice(0, 3);
  }

  // ====== VISUEL DE PARTAGE v2 (composer avec sélection de photo + html2canvas) ======
  // Remplace generateViralImagePro. Garde une fonction de même nom qui génère
  // directement (utilisée par shareSocial pour FB/IG), plus openShareComposer
  // qui ouvre une modale de prévisualisation avec flèches.

  // Collecte TOUTES les photos du voyage, avec le nom de l'étape associée
  function collectTripPhotos(rt){
    const out = [];
    if (!rt.steps || !Array.isArray(rt.steps)) return out;
    const seen = {};
    for (const step of rt.steps){
      const pid = step.place_id || step.pid;
      if (!pid) continue;
      const photos = getPhotosForPlace(pid) || [];
      for (const url of photos){
        if (!url || seen[url]) continue;
        seen[url] = true;
        out.push({ url: url, place: step.name || '' });
      }
    }
    return out;
  }

  // Optimise une URL photo via wsrv.nl (CORS ok pour html2canvas)
  function shareProxyPhoto(url, w){
    if (!url) return '';
    w = w || 1080;
    if (url.indexOf('wsrv.nl') >= 0) return url;
    return 'https://wsrv.nl/?url=' + encodeURIComponent(url) + '&w=' + w + '&q=80&output=webp';
  }

  // Construit le SVG du tracé à partir des coordonnées des étapes
  // Couleurs des boucles, identiques à carte_builder.html
  const LOOP_COLORS = ['#2563eb', '#e11d48', '#059669', '#d97706', '#7c3aed', '#0891b2', '#db2777', '#4d7c0f'];
  const LINK_COLOR = '#64748b';
  function loopColor(l){ return l < 0 ? LINK_COLOR : LOOP_COLORS[l % LOOP_COLORS.length]; }

  // Une boucle = la portion comprise entre deux passages par le même lieu (-1 = liaison)
  function computeLegLoops(keys){
    const n = keys.length;
    const legLoop = new Array(Math.max(0, n-1)).fill(-1);
    const seen = new Map();
    let loop = 0;
    for (let j = 0; j < n; j++){
      const id = keys[j];
      if (seen.has(id)){
        const k = seen.get(id);
        for (let L = k; L < j; L++) if (legLoop[L] === -1) legLoop[L] = loop;
        loop++;
        for (let m = k; m < j; m++) seen.delete(keys[m]);
        seen.set(id, j);
      } else {
        seen.set(id, j);
      }
    }
    return legLoop;
  }

  function buildRouteSvg(steps){
    const kept = (steps || [])
      .map(s => ({ lat: s.lat, lon: (s.lon != null ? s.lon : s.lng), key: s.place_id || s.name || '', name: s.name || '' }))
      .filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
    const pts = kept;

    const W = 1080, H = 300, padX = 70, padTop = 56, padBot = 40;
    if (pts.length < 2){
      return '<svg viewBox="0 0 '+W+' '+H+'" style="position:absolute;inset:0;width:100%;height:100%"></svg>';
    }

    // Projection Mercator, aspect géographique respecté (plus d'écrasement)
    const RAD = Math.PI/180;
    const merc = pts.map(p => ({
      x: p.lon * RAD,
      y: Math.log(Math.tan(Math.PI/4 + (p.lat*RAD)/2))
    }));
    const xs = merc.map(p=>p.x), ys = merc.map(p=>p.y);
    const minX = Math.min.apply(null,xs), maxX = Math.max.apply(null,xs);
    const minY = Math.min.apply(null,ys), maxY = Math.max.apply(null,ys);
    const spanX = (maxX-minX)||1e-6, spanY = (maxY-minY)||1e-6;
    const availW = W - 2*padX, availH = H - padTop - padBot;
    const scale = Math.min(availW/spanX, availH/spanY);
    const offX = padX + (availW - spanX*scale)/2;
    const offY = padTop + (availH - spanY*scale)/2;

    const xy = merc.map(p => ({
      x: offX + (p.x - minX)*scale,
      y: offY + (maxY - p.y)*scale
    }));

    // Chemin lissé sur une plage de points donnée
    const pathFor = (from, to) => {
      let d = 'M ' + xy[from].x.toFixed(1) + ' ' + xy[from].y.toFixed(1);
      for (let i = from + 1; i <= to; i++){
        const prev = xy[i-1], cur = xy[i];
        const mx = (prev.x + cur.x) / 2, my = (prev.y + cur.y) / 2;
        d += ' Q ' + prev.x.toFixed(1) + ' ' + prev.y.toFixed(1) + ' ' + mx.toFixed(1) + ' ' + my.toFixed(1);
      }
      d += ' T ' + xy[to].x.toFixed(1) + ' ' + xy[to].y.toFixed(1);
      return d;
    };

    // Découpe en portions de même boucle, une couleur par boucle
    const legLoop = computeLegLoops(pts.map(p => p.key));
    const groups = [];
    for (let i = 0; i < legLoop.length; i++){
      const last = groups[groups.length-1];
      if (last && last.loop === legLoop[i] && last.end === i) last.end = i + 1;
      else groups.push({ loop: legLoop[i], start: i, end: i + 1 });
    }

    let paths = '';
    groups.forEach(g => {
      const d = pathFor(g.start, g.end);
      const c = loopColor(g.loop);
      paths += '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.16"/>';
      paths += '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 12"/>';
    });

    // Numérotation calée sur la liste "Nos étapes", qui dédoublonne par nom.
    // Un lieu traversé deux fois porte donc un seul point, avec son numéro de liste.
    const numByName = {};
    let nextNum = 0;
    (steps || []).forEach(s => {
      const n = s.name;
      if (n && !numByName[n]) numByName[n] = ++nextNum;
    });

    let dots = '';
    const drawn = {};
    xy.forEach((p, i) => {
      const nm = pts[i].name;
      if (nm && drawn[nm]) return;          // lieu déjà représenté (hub repassé)
      if (nm) drawn[nm] = true;
      const num = (nm && numByName[nm]) ? numByName[nm] : (i + 1);
      const isEnd = (i === 0 || i === xy.length - 1);
      dots += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="13" fill="#fff" stroke="#113f7a" stroke-width="3"/>';
      dots += '<text x="'+p.x.toFixed(1)+'" y="'+(p.y+4.6).toFixed(1)+'" text-anchor="middle" font-family="Mulish,sans-serif" font-size="13" font-weight="800" fill="'+(isEnd?'#b8860b':'#113f7a')+'">'+num+'</text>';
    });

    return ''
      + '<svg viewBox="0 0 '+W+' '+H+'" style="position:absolute;inset:0;width:100%;height:100%">'
      + paths
      + dots
      + '</svg>';
  }

  // URL de la carte webp préfabriquée à partir de _originalItinId (null si custom/temp).
  // Reproduit la slugification de generate-v3.js, puis retire le préfixe code pays.
  function ortMapUrlFromItin(rt){
    const itinId = (rt && rt._originalItinId) || '';
    if (!itinId || /custom|^temp|^\d{10,}/.test(itinId)) return null;
    const cc = itinId.split('::')[0].toLowerCase();
    let s = itinId.toLowerCase().replace(/::/g,'-').replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
    if (cc && s.indexOf(cc+'-') === 0) s = s.slice(cc.length+1);
    if (!cc || !s) return null;
    return 'https://photos.oneroadtrip.com/'+cc.toUpperCase()+'/maps/'+s+'.webp';
  }

  // Teste qu'une image se charge vraiment (sinon repli SVG). Renvoie l'URL ou null.
  function ortProbeImg(url){
    return new Promise(function(res){
      if (!url) return res(null);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      let done = false;
      const fin = (ok) => { if(!done){ done = true; res(ok ? url : null); } };
      img.onload = () => fin(img.naturalWidth > 0);
      img.onerror = () => fin(false);
      setTimeout(() => fin(false), 6000);
      img.src = url;
    });
  }

  // Résout la carte préfa (avec cache par URL) : URL si elle charge, sinon null -> SVG.
  const _ortMapCache = {};
  function resolveShareMap(rt){
    const raw = ortMapUrlFromItin(rt);
    if (!raw) return Promise.resolve(null);
    // Passe par le proxy wsrv.nl (comme les photos) : photos.oneroadtrip.com n'envoie pas
    // d'en-tête CORS, donc l'image brute est refusée par html2canvas. Le proxy ajoute le CORS.
    const url = shareProxyPhoto(raw, 1080);
    if (!_ortMapCache[url]) _ortMapCache[url] = ortProbeImg(url);
    return _ortMapCache[url];
  }

  function escHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Génère le PNG à partir d'une card déjà dans le DOM
  async function renderCardToPng(card){
    if (!window.html2canvas) throw new Error('html2canvas absent');
    try {
      if (document.fonts && document.fonts.ready) {
        await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
      }
    } catch(e){}
    const h2c = window.html2canvas(card, {
      width: 1080, height: 1080,
      windowWidth: 1080, windowHeight: 1080,
      x: 0, y: 0, scrollX: 0, scrollY: 0,
      scale: 1, useCORS: true, allowTaint: false, backgroundColor: '#f6f1e7',
      logging: false, imageTimeout: 8000
    });
    const canvas = await Promise.race([
      h2c,
      new Promise((_, rej) => setTimeout(() => rej(new Error('html2canvas timeout')), 15000))
    ]);
    return canvas.toDataURL('image/png');
  }

  async function captureCardOffscreen(rt, photo){

  // Attend le chargement des images d'un noeud, avec timeout par image
  function waitImages(node){
    const imgs = Array.prototype.slice.call(node.querySelectorAll('img'));
    return Promise.all(imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(res => {
        let done = false;
        const finish = () => { if(!done){ done = true; res(); } };
        img.onload = finish;
        img.onerror = finish;
        setTimeout(finish, 6000);
      });
    }));
  }

  // Générer le texte viral pour le post
  function generateViralText(rt, publicUrl) {
    const lang = localStorage.getItem('lang') || 'fr';
    const L = I18N[lang] || I18N.en;
    
    const title = rt.title || (L?.untitled || 'Mon roadtrip');
    const nights = rt.nights || rt.nb_nights || 0;
    const kms = rt.kms || 0;
    
    let text = `🗺️ Mon roadtrip OneRoadTrip : ${title}\n\n`;
    
    // Dates
    if (rt.steps && rt.steps.length > 0 && rt.steps[0].date) {
      const firstDate = rt.steps[0].date;
      const lastStep = rt.steps[rt.steps.length - 1];
      const lastDate = lastStep.date;
      text += `📅 ${formatDateRange(firstDate, lastDate)}\n`;
    }
    
    text += `🌙 ${nights} nuits inoubliables\n`;
    text += `🚗 ${kms} km\n\n`;
    
    // Étapes
    if (rt.steps && rt.steps.length > 0) {
      text += `📍 Nos étapes :\n`;
      rt.steps.forEach((step, i) => {
        const stepName = step.name || step.place_id?.split('::')[1] || `Étape ${i+1}`;
        text += `   → ${stepName}\n`;
      });
      text += `\n`;
    }
    
    text += `Créez votre roadtrip sur mesure ! 👉 ${publicUrl}\n\n`;
    text += `#OneRoadTrip #Roadtrip #Voyage #Travel`;
    
    // Ajouter hashtag du pays
    const country = rt.country || rt.cc;
    if (country) {
      const countryNames = {
        'FR': 'France', 'IT': 'Italy', 'ES': 'Spain', 'PT': 'Portugal',
        'DE': 'Germany', 'UK': 'UnitedKingdom', 'US': 'USA'
      };
      const countryName = countryNames[country.toUpperCase()];
      if (countryName) text += ` #${countryName}`;
    }
    
    return text;
    
    function formatDateRange(start, end) {
      if (!start) return '';
      const startDate = new Date(start);
      const endDate = end ? new Date(end) : startDate;
      
      const options = { day: 'numeric', month: 'long', year: 'numeric' };
      const startStr = startDate.toLocaleDateString(ortDateLocale(), options);
      const endStr = endDate.toLocaleDateString(ortDateLocale(), options);
      
      if (startDate.toDateString() === endDate.toDateString()) {
        return `Le ${startStr}`;
      }
      return `Du ${startStr} au ${endStr}`;
    }
  }

  // Calcul distance Haversine entre deux points (fallback si rt.kms vide)
  function calculateTotalKm(steps) {
    if (!Array.isArray(steps) || steps.length < 2) return 0;
    
    const R = 6371; // Rayon de la Terre en km
    const toRad = (deg) => deg * Math.PI / 180;
    
    let totalKm = 0;
    for (let i = 0; i < steps.length - 1; i++) {
      const a = steps[i];
      const b = steps[i + 1];
      
      if (!Number.isFinite(a.lat) || !Number.isFinite(a.lon) ||
          !Number.isFinite(b.lat) || !Number.isFinite(b.lon)) {
        continue;
      }
      
      const dLat = toRad(b.lat - a.lat);
      const dLon = toRad(b.lon - a.lon);
      const sinDLat = Math.sin(dLat / 2);
      const sinDLon = Math.sin(dLon / 2);
      
      const a_calc = sinDLat * sinDLat +
                     Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) *
                     sinDLon * sinDLon;
      
      const c = 2 * Math.atan2(Math.sqrt(a_calc), Math.sqrt(1 - a_calc));
      totalKm += R * c;
    }
    
    return Math.round(totalKm);
  }

function ensureSeed(){

  // API publique

      // Format 1: tableau de trips (export standard)
      if(Array.isArray(data)) {
        trips = data;
      }
      // Format 2: module.json (avec itineraries)
      else if(data && typeof data === 'object') {
        const itins = data.itineraries || data.itins || [];
        // Convertir chaque itinéraire en trip
        for(const itin of itins) {
          trips.push({

            country: itin.dept_code,
            dept_name: itin.dept_name,

            regions: itin.regions,
            meta: itin.meta,
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
        }
      }
      
      // Sauvegarder tous les trips
      for (const trip of trips) {

    // Export au format importable (.itins.modules.json)
    async exportAsModules() {
      if(!currentUser) return null;
      const tripsList = await window.ORT_STATE.getAllTrips();
      
      if(tripsList.length === 0) return null;
      
      // Charger chaque trip complètement (avec steps depuis Firestore)
      const trips = [];
      for(const t of tripsList) {
        if(t.id) {
          const fullTrip = await window.ORT_STATE.getTrip(t.id);
          if(fullTrip) {
            // Convertir steps → days_plan si nécessaire
            if(fullTrip.steps && Array.isArray(fullTrip.steps) && !fullTrip.days_plan) {
              fullTrip.days_plan = fullTrip.steps.map((step, idx) => {
                // Extraire les coordonnées
                const coords = step.coords || step.lat && step.lon ? [step.lat, step.lon] : [0, 0];
                
                // Extraire place_id et nom
                const placeId = step.place_id || step.placeId || '';
                
                // Convertir visits et activities
                const visits = (step.visits || []).map(v => ({
                  text: typeof v === 'string' ? v : (v.text || v.name || ''),
                  visit_duration_min: v.visit_duration_min || 75
                }));
                
                const activities = (step.activities || []).map(a => ({
                  text: typeof a === 'string' ? a : (a.text || a.name || ''),
                  visit_duration_min: a.visit_duration_min || 60
                }));
                
                return {
                  day: idx + 1,
                  slice: 1,
                  region_code: step.region || step.region_code || '',
                  night: {
                    place_id: placeId,
                    coords: coords
                  },
                  visits: visits,
                  activities: activities,
                  to_next_leg: step.to_next_leg || {}
                };
              });
              
              // Générer segments basiques
              if(!fullTrip.segments && fullTrip.steps.length > 0) {
                fullTrip.segments = [{
                  n: 1,
                  range: [1, fullTrip.steps.length],
                  label: `Segment 1 — J1–J${fullTrip.steps.length}`,
                  from_day: 1,
                  to_day: fullTrip.steps.length
                }];
              }
              
              // Générer variants basiques
              if(!fullTrip.variants && fullTrip.steps.length > 0) {
                fullTrip.variants = [{
                  from_day: 1,
                  to_day: fullTrip.steps.length,
                  label: `Var ${fullTrip.steps.length}j`
                }];
              }
            }
            trips.push(fullTrip);
          }
        }
      }
      
      // Grouper par pays
      const byCountry = {};
      for(const trip of trips) {
        // Extraire le code pays de différentes sources
        let cc = trip.country || trip.dept_code;
        if(!cc && trip.id) {
          // Essayer d'extraire depuis l'ID (format: "CC::slug")
          const match = trip.id.match(/^([A-Z]{2})::/i);
          if(match) cc = match[1].toUpperCase();
        }
        if(!cc) cc = 'XX'; // Fallback
        
        if(!byCountry[cc]) byCountry[cc] = [];
        byCountry[cc].push(trip);
      }
      
      // Créer un fichier par pays
      const exports = [];
      for(const [cc, tripList] of Object.entries(byCountry)) {
        const moduleData = {
          version: 'v1',
          country: cc,
          itineraries: tripList.map(t => {
            // S'assurer que l'ID est au bon format
            let itinId = t.id || t.itin_id;
            if(itinId && !itinId.startsWith(`${cc}::`)) {
              // Si l'ID n'a pas le préfixe pays, l'ajouter
              itinId = `${cc}::${itinId}`;
            }
            if(!itinId) {
              // Générer un ID depuis le titre
              const slug = (t.title || 'untitled').toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // retirer accents
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
              itinId = `${cc}::${slug}`;
            }
            
            return {
              itin_id: itinId,
              id: itinId,
              dept_code: cc,
              dept_name: t.dept_name || t.country_name || '',
              title: t.title || '',
              notes: t.notes || '',
              specialties: t.specialties || [],
              pacing_rules: t.pacing_rules || {
                factors: { soft: 2, standard: 1, fast: 0.5 },
                day_budgets_min: { soft: 300, standard: 420, fast: 540 },
                merge_threshold: 0.85
              },
              days_plan: t.days_plan || [],
              segments: t.segments || [],
              variants: t.variants || [],
              regions: t.regions || [],
              merge_suggestions: t.merge_suggestions || [],
              meta: t.meta || { themes: [], audience: [] }
            };
          })
        };
        
        exports.push({
          filename: `${cc}.itins.modules.json`,
          country: cc,
          count: tripList.length,
          withDays: tripList.filter(t => t.days_plan && t.days_plan.length > 0).length,
          data: moduleData
        });
      }
      
      return exports;
    }
  };
})();

// ===== Synchronisation auto depuis your_roadtrip =====
(async function syncLastSave(){
  try {
    const last = localStorage.getItem('ort.last_save');
    if(!last) return;
    const rt = JSON.parse(last);
    if(!rt.id) return;
    
    // Attendre que Firebase et ORT_STATE soient prêts
    await ensureFirebase();
    const user = firebase.auth().currentUser;
    if (!user || !window.ORT_STATE) return;
    
    console.log('📥 [SYNC] Migration dernier RT sauvegardé:', rt.id);
    
    // Sauvegarder via le State Manager (Firestore)
    await window.ORT_STATE.saveTrip(rt);
    
    // Nettoyer
    localStorage.removeItem('ort.last_save');
    
    console.log('✅ [SYNC] RT migré vers Firestore');
  } catch(e){
    console.error('❌ [SYNC] Erreur migration:', e);
  }
})();

(function(){
document.getElementById('btnNew').addEventListener('click',()=>{

  location.href = 'index.html?lang=' + code;

document.getElementById('btnStart').addEventListener('click',()=>{

});
  document.getElementById('btnImport').addEventListener('click',async()=>{
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = async(e) => {
      const file = e.target.files[0];
      if(!file) return;
      try {
        const txt = await file.text();
        const obj = JSON.parse(txt);
        const count = await Dashboard.import(obj);
        toast(`${count} voyage(s) importé(s)`);
      } catch(err) {
        alert('Erreur: ' + err.message);
      }
    };
    input.click();
  });
  document.getElementById('btnExportAll').addEventListener('click',async()=>{
    const data = Dashboard.exportAll();
    try{ await navigator.clipboard.writeText(data); toast('Export copié dans le presse‑papiers'); }catch(_){ alert(data); }
  });
  document.getElementById('btnExportModules')?.addEventListener('click',async()=>{
    const exports = await Dashboard.exportAsModules();
    if(!exports || exports.length === 0) {
      alert('Aucun voyage à exporter');
      return;
    }
    
    // Afficher un message avec les stats
    const totalTrips = exports.reduce((sum, e) => sum + e.count, 0);
    const tripsWithDays = exports.reduce((sum, e) => sum + e.withDays, 0);
    
    if(tripsWithDays === 0) {
      alert(`${totalTrips} voyage(s) trouvé(s) mais aucun n'a de days_plan.\nLes itinéraires sont peut-être en cours de création.`);
      return;
    }
    
    if(tripsWithDays < totalTrips) {
      const cont = confirm(`${totalTrips} voyage(s) trouvé(s), ${tripsWithDays} complet(s).\n${totalTrips - tripsWithDays} voyage(s) sans days_plan seront exportés vides.\n\nContinuer ?`);
      if(!cont) return;
    }
    
    // Pour chaque pays, télécharger un fichier séparé
    for(const exp of exports) {
      const blob = new Blob([JSON.stringify(exp.data, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = exp.filename;
      a.click();
      URL.revokeObjectURL(url);
      await new Promise(r => setTimeout(r, 300)); // délai entre téléchargements
    }
    
    toast(`${exports.length} fichier(s) téléchargé(s) (${tripsWithDays}/${totalTrips} complets)`);
  });
  
  document.getElementById('btnDeleteAll')?.addEventListener('click',async()=>{
    const DL = window._DASH_L || I18N.en;
    if(!firebase.auth().currentUser) {
      alert(DL.needLoginAction || 'Vous devez être connecté');
      return;
    }
    
    const trips = await window.ORT_STATE.getAllTrips();
    if(trips.length === 0) {
      alert(DL.empty || 'Aucun voyage');
      return;
    }
    
    const conf = confirm(DL.confirmDelAll || 'Tout supprimer ? Cette action est irréversible.');
    if(!conf) return;
    

    
    // Supprimer tous les voyages
    let deleted = 0;
    for(const trip of trips) {
      if(trip.id) {
        const success = await window.ORT_STATE.deleteTrip(trip.id);
        if(success) deleted++;
      }
    }
    
toast(`${deleted} voyage(s) supprimé(s)`);
    // Rafraîchir l'affichage sans recharger la page
    setTimeout(async () => {
      await render();
    }, 1000);
  });
})();

// ===== mini toast =====
function toast(msg, isHtml = false, duration = 1800){ 
  const d=document.createElement('div'); 
  if(isHtml) {
    d.innerHTML = msg;
  } else {
    d.textContent = msg;
  }
  d.style.position='fixed'; 
  d.style.left='50%'; 
  d.style.transform='translateX(-50%)'; 
  d.style.bottom='16px'; 
  d.style.background='#fff'; 
  d.style.color='#113f7a'; 
  d.style.border='1px solid #c3d6b6'; 
  d.style.borderRadius='10px'; 
  d.style.padding='10px 14px'; 
  d.style.boxShadow='0 8px 24px rgba(0,0,0,.12)'; 
  d.style.zIndex='9999';
  d.style.maxWidth='400px';
  d.style.textAlign='left';
  document.body.appendChild(d); 
  setTimeout(()=>{ d.remove(); }, duration); 
}
